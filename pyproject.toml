[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dra"
version = "0.1.0"
description = "Deep Research Agent — transparent, reliable research via claim verification + adaptive retrieval"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "datasets>=2.20", "scipy>=1.11", "matplotlib>=3.7"]
demo = ["streamlit>=1.36", "markdown>=3.6", "weasyprint>=60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
